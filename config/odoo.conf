[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64
data_dir = /var/lib/odoo
addons_path = /opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
# The database manager is not exposed: the engine refuses /web/database/* unless
# an address is explicitly allowlisted in tcsi.db_manager_allow_ips, and the
# database list stays hidden (production audit findings H5, H6, M7, L1).
list_db = False
# The engine always runs behind a TLS-terminating proxy, so it has to trust the
# forwarded scheme and host (findings H4, M3, M6). Override admin_passwd with a
# real secret in production; "admin" is a local-only default.
proxy_mode = True
workers = 0
max_cron_threads = 1
without_demo = all
log_level = info
