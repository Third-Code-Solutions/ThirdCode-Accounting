# Posts GitHub deployment status for this repo into its project Discord channel.
# Deploy events are not rendered by Discord's native /github webhook endpoint,
# so Railway/Vercel deploy statuses reach Discord through this workflow.
# Requires repo secret: DISCORD_DEPLOY_WEBHOOK (Discord incoming webhook URL).
name: Notify Discord on deploy

on:
  deployment_status:
  workflow_dispatch:

permissions: {}

jobs:
  discord:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success' ||
      github.event.deployment_status.state == 'failure' ||
      github.event.deployment_status.state == 'error'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
      STATE: ${{ github.event.deployment_status.state }}
      DESC: ${{ github.event.deployment_status.description }}
      ENV_NAME: ${{ github.event.deployment.environment }}
      ENV_URL: ${{ github.event.deployment_status.environment_url }}
      TARGET_URL: ${{ github.event.deployment_status.target_url }}
      LOG_URL: ${{ github.event.deployment_status.log_url }}
      REPO: ${{ github.repository }}
      REF: ${{ github.event.deployment.ref }}
      SHA: ${{ github.event.deployment.sha }}
      CREATOR: ${{ github.event.deployment.creator.login }}
    steps:
      - name: Post deploy status to Discord
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_DEPLOY_WEBHOOK secret is not set; skipping notification."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          state = (os.environ.get("STATE") or "").strip()
          manual = not state
          if manual:
              state = "ready"
          emoji = {"success": "✅", "failure": "❌", "error": "⚠️", "ready": "🔔"}.get(state, "ℹ️")
          color = {"success": 0x2ECC71, "failure": 0xE74C3C, "error": 0xE67E22, "ready": 0x5865F2}.get(state, 0x95A5A6)
          repo = os.environ.get("REPO", "")
          proj = repo.split("/")[-1] if repo else "project"
          env_name = os.environ.get("ENV_NAME") or ("test run" if manual else "deployment")
          sha = (os.environ.get("SHA") or "").strip()
          short = sha[:7] if sha else "-"
          fields = []
          if manual:
              title = f"{emoji} Deploy notifications armed: {proj}"
              desc = "Manual test run from GitHub Actions. Railway/Vercel deploy statuses will land here automatically."
              url = f"https://github.com/{repo}/actions/workflows/notify-discord-deploy.yml"
          else:
              title = f"{emoji} Deploy {state}: {proj} \u2192 {env_name}"
              desc = (os.environ.get("DESC") or "").strip()
              url = os.environ.get("ENV_URL") or os.environ.get("TARGET_URL") or f"https://github.com/{repo}/deployments"
              ref = os.environ.get("REF")
              if ref:
                  fields.append({"name": "Ref", "value": f"`{ref}`", "inline": True})
              if repo and sha:
                  fields.append({"name": "Commit", "value": f"[`{short}`](https://github.com/{repo}/commit/{sha})", "inline": True})
              fields.append({"name": "By", "value": os.environ.get("CREATOR") or "automation", "inline": True})
              log_url = os.environ.get("LOG_URL")
              if log_url:
                  fields.append({"name": "Logs", "value": log_url})
          embed = {
              "title": title,
              "url": url,
              "color": color,
              "fields": fields,
              "footer": {"text": "GitHub Deploy \u2192 Discord"},
          }
          if desc:
              embed["description"] = desc[:360]
          payload = {"username": f"Deploy \u00b7 {proj}", "embeds": [embed]}
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "deploy-notify"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("posted to discord:", resp.status)
          PY
