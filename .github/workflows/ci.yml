name: TCSI platform quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate accounting deployment package
        run: python scripts/validate-odoo-package.py

      - name: Verify branding regression
        run: node --test scripts/test-branding.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate database migrations
        run: npm run validate:migrations

      - name: Build web and worker
        run: npm run build

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
