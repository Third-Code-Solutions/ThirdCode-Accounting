name: TCSI platform quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  orvexa-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned accounting runtime
        run: docker build -f docker/odoo/Dockerfile --build-arg INSTALL_ODOO_TEST_HELPER=true -t tcsi-orvexa-ci .
      - name: Compile app launcher styles with the production Sass runtime
        run: >-
          docker run --rm --entrypoint python3 tcsi-orvexa-ci -c
          "import sass; from pathlib import Path; sass.compile(string=Path('/opt/extra-addons/thirdcode_accounting/static/src/scss/tcsi_apps.scss').read_text())"
      - name: Install accounting and run Third Code tests in a disposable database
        run: >-
          docker run --rm --network host --env PYTHONPATH=/opt/tcsi-test-deps --entrypoint odoo
          --mount type=volume,source=tcsi-native-ci-data,target=/var/lib/odoo tcsi-orvexa-ci
          --db_host=127.0.0.1 --db_user=odoo --db_password=ci-disposable-only
          -d tcsi_orvexa_ci --addons-path=/opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
          -i thirdcode_accounting --without-demo=all --test-enable --test-tags /thirdcode_accounting --stop-after-init --no-http --max-cron-threads=0
      - name: Verify ORVEXA authorization, execution and memory
        run: >-
          docker run --rm --network host --entrypoint python3
          --env PYTHONPATH=/opt/tcsi-test-deps
          --mount type=volume,source=tcsi-native-ci-data,target=/var/lib/odoo
          --mount "type=bind,source=$PWD/scripts,target=/tcsi-tests,readonly"
          tcsi-orvexa-ci /tcsi-tests/test_orvexa_integration.py
          --db_host=127.0.0.1 --db_user=odoo --db_password=ci-disposable-only
          -d tcsi_orvexa_ci --addons-path=/opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
          --no-http --max-cron-threads=0
      - name: Prepare private annual smoke evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/tcsi-annual-evidence"
          # Set only this disposable artifact directory to the runtime owner.
          docker run --rm --user root --entrypoint sh \
            --mount "type=bind,source=$RUNNER_TEMP/tcsi-annual-evidence,target=/tcsi-evidence" \
            tcsi-orvexa-ci -c 'chown odoo:odoo /tcsi-evidence && chmod 700 /tcsi-evidence'
        shell: bash
      - name: Verify annual accounting operations and native PDFs on an isolated clone
        run: >-
          docker run --rm --network host --entrypoint python3
          --env PYTHONPATH=/opt/tcsi-test-deps
          --env PGHOST=127.0.0.1 --env PGPORT=5432 --env PGUSER=odoo
          --env PGPASSWORD=ci-disposable-only --env PGDATABASE=tcsi_orvexa_ci
          --env TCSI_ANNUAL_NATIVE_CI=disposable-only
          --env TCSI_ANNUAL_EVIDENCE=/tcsi-evidence/annual
          --mount type=volume,source=tcsi-native-ci-data,target=/var/lib/odoo
          --mount "type=bind,source=$PWD/scripts,target=/tcsi-tests,readonly"
          --mount "type=bind,source=$RUNNER_TEMP/tcsi-annual-evidence,target=/tcsi-evidence"
          tcsi-orvexa-ci /tcsi-tests/test_annual_native.py
      - name: Return private evidence ownership to the CI runner
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/tcsi-annual-evidence" ]; then
            docker run --rm --user root --entrypoint chown \
              --mount "type=bind,source=$RUNNER_TEMP/tcsi-annual-evidence,target=/tcsi-evidence" \
              tcsi-orvexa-ci -R "$(id -u):$(id -g)" /tcsi-evidence
          fi
      - name: Retain synthetic annual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-native-smoke
          path: |
            ${{ runner.temp }}/tcsi-annual-evidence/annual/summary.json
            ${{ runner.temp }}/tcsi-annual-evidence/annual/*.log
            ${{ runner.temp }}/tcsi-annual-evidence/annual/annual-results/
          if-no-files-found: warn
          retention-days: 14

  hosted-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Match production: PG 18 dump output uses transaction_timeout, which
        # PostgreSQL 16 cannot restore. The native integration job retains PG 16.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: tcsi_orvexa_hosted_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d tcsi_orvexa_hosted_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Build production runtime without test helpers
        run: docker build -f docker/odoo/Dockerfile -t tcsi-hosted-ci .
      - name: Verify hosted HTTP and evented WebSocket routing
        run: >-
          docker run --rm --network host --entrypoint python3
          --env PGHOST=127.0.0.1 --env PGPORT=5432 --env PGUSER=odoo
          --env PGPASSWORD=ci-disposable-only --env PGDATABASE=tcsi_orvexa_hosted_ci
          --env TCSI_ADMIN_LOGIN=hosted-ci@example.invalid
          --env TCSI_ADMIN_PASSWORD=ci-disposable-password-never-use-in-production
          --env TCSI_MASTER_PASSWORD=ci-disposable-master-never-use-in-production
          --env PORT=18069
          --mount "type=bind,source=$PWD/scripts,target=/tcsi-tests,readonly"
          tcsi-hosted-ci /tcsi-tests/test_hosted_http.py
      - name: Verify coordinated recovery against disposable PostgreSQL
        run: >-
          docker run --rm --network host --entrypoint python3
          --env PGHOST=127.0.0.1 --env PGPORT=5432 --env PGUSER=odoo
          --env PGPASSWORD=ci-disposable-only
          --env TCSI_RECOVERY_TEST_PG=disposable-only
          --mount "type=bind,source=$PWD/scripts,target=/tcsi-tests,readonly"
          tcsi-hosted-ci /tcsi-tests/test_hosted_backup.py
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate accounting deployment package
        run: python scripts/validate-odoo-package.py

      - name: Check saved client demo validation
        run: python scripts/test_check_client_demo.py

      - name: Check live company readiness validation
        run: python scripts/test_check_company_readiness.py

      - name: Verify hosted runtime supervision
        run: python scripts/test_hosted_runtime.py

      - name: Verify isolated performance benchmark safeguards
        run: python scripts/test_benchmark.py

      - name: Verify annual performance scenario safeguards
        run: python scripts/test_benchmark_annual.py

      - name: Install pinned recovery provider test dependencies
        run: python -m pip install --require-hashes -r scripts/recovery-provider-requirements.txt

      - name: Verify recovery provider contracts and restore preparation
        run: python scripts/test_hosted_recovery_provider.py

      - name: Verify branding regression
        run: |
          node --test scripts/test-branding.mjs
          node --test scripts/test-orvexa-chat.mjs
          node --test scripts/test-apps.mjs
          node --test scripts/test-design-tokens.mjs
          python scripts/test-branding.py

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate database migrations
        run: npm run validate:migrations

      - name: Build web and worker
        run: npm run build

      - name: Audit production dependencies
        # Gate the surface that actually ships. The 2026-09-18 braces advisory
        # (CVE-2026-93687) has no patched version (first_patched: None) and its
        # chain (braces <- micromatch <- fast-glob <- @next/eslint-plugin-next)
        # is ESLint tooling only; the package keeps no runtime dependencies.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree (informational)
        run: npm audit --audit-level=high || true
