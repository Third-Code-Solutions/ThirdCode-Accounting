name: TCSI platform quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  orvexa-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned accounting runtime
        run: docker build -f docker/odoo/Dockerfile -t tcsi-orvexa-ci .
      - name: Install accounting in a disposable database
        run: >-
          docker run --rm --network host tcsi-orvexa-ci odoo
          --db_host=127.0.0.1 --db_user=odoo --db_password=ci-disposable-only
          -d tcsi_orvexa_ci --addons-path=/opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
          -i thirdcode_accounting --without-demo=all --stop-after-init --no-http --max-cron-threads=0
      - name: Verify ORVEXA authorization, execution and memory
        run: >-
          docker run --rm --network host --entrypoint python3
          --mount "type=bind,source=$PWD/scripts,target=/tcsi-tests,readonly"
          tcsi-orvexa-ci /tcsi-tests/test_orvexa_integration.py
          --db_host=127.0.0.1 --db_user=odoo --db_password=ci-disposable-only
          -d tcsi_orvexa_ci --addons-path=/opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
          --no-http --max-cron-threads=0
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate accounting deployment package
        run: python scripts/validate-odoo-package.py

      - name: Verify branding regression
        run: |
          node --test scripts/test-branding.mjs
          python scripts/test-branding.py

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate database migrations
        run: npm run validate:migrations

      - name: Build web and worker
        run: npm run build

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
